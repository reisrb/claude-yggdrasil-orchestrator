<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="orq-token" content="__ORQ_TOKEN__">
  <title>Office</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <header id="topo">
    <div class="marca">
      <span class="logo" aria-hidden="true">◆</span>
      <span id="nome">Office</span>
      <span id="modo" class="chip"></span>
      <span id="sim" class="chip sim" hidden>simulação</span>
    </div>
    <div id="resumo" class="resumo"></div>
    <button id="btn-atencao" class="btn btn-atencao" type="button" aria-expanded="false" aria-controls="caixa-pop" title="Caixa de atenção: quem está esperando você e o que está rodando">Caixa de atenção ▾</button>
    <div id="limites" class="limites" title="Limites de uso da Claude (sessão de 5 h e semana)"></div>
    <nav class="visoes" aria-label="Visões">
      <a href="#/escritorio" data-visao="escritorio">Escritório</a>
      <a href="#/painel" data-visao="painel">Painel</a>
      <a href="#/fluxos" data-visao="fluxos">Fluxos</a>
      <a href="#/aprendizado" data-visao="aprendizado">Aprendizado</a>
      <a href="#/biblioteca" data-visao="biblioteca">Biblioteca</a>
      <a href="#/chats" data-visao="chats">Chats</a>
    </nav>
    <div class="acoes-topo">
      <button id="btn-missao" class="btn primario" type="button">＋ Nova missão</button>
      <button id="btn-chat" class="btn" type="button" title="Conversa livre com o orquestrador, sem fluxo">💬 Novo chat</button>
      <button id="btn-notif" class="btn icone" type="button" title="Notificações do navegador">🔔</button>
      <button id="btn-som" class="btn icone" type="button" title="Som ao precisar de você">🔊</button>
    </div>
  </header>

  <main id="principal">
    <section id="palco" aria-label="Escritório">
      <canvas id="tela"></canvas>
      <div id="conexao" class="aviso" hidden>sem conexão com o servidor do Office</div>
    </section>
    <section id="pagina-painel" class="pagina-painel" aria-label="Painel de agentes" hidden></section>
    <section id="pagina-fluxos" class="pagina-fluxos" aria-label="Organizador de fluxos" hidden></section>
    <section id="pagina-aprendizado" class="pagina-atlas" aria-label="Mapa de aprendizado" hidden></section>
    <section id="pagina-biblioteca" class="pagina-biblioteca" aria-label="Biblioteca de skills" hidden></section>
    <section id="pagina-chats" class="pagina-chats" aria-label="Chats livres" hidden></section>

    <aside id="lateral">
      <div id="lateral-alca" class="lateral-alca" title="Arraste para alargar ou estreitar a lateral · dois cliques voltam ao tamanho padrão"></div>
      <section id="caixa">
        <h2>Caixa de atenção <span id="contagem" class="chip"></span></h2>
        <div id="caixa-filtro" class="caixa-filtro" role="tablist" aria-label="Filtro da caixa de atenção"></div>
        <ul id="lista" class="lista"></ul>
      </section>

      <section id="detalhe">
        <div id="conversa" hidden>
          <div class="conv-topo">
            <button id="voltar" class="btn icone" type="button" title="Fechar conversa">←</button>
            <div class="conv-titulo">
              <div class="conv-l1"><b id="conv-repo"></b> <span id="conv-status" class="chip"></span></div>
            </div>
            <button id="conv-cheia" class="btn icone" type="button" title="Conversa em tela cheia (Esc volta)">⤢</button>
          </div>
          <div class="conv-linha2">
            <small id="conv-sub"></small>
            <div class="conv-acoes">
              <button class="btn" data-acao="atlas" type="button" title="Ver a etapa no organizador de fluxos">Fluxo</button>
              <button class="btn" data-acao="terminal" type="button" title="Continuar esta sessão no seu terminal (claude --resume)">Levar ao terminal</button>
              <button class="btn" data-acao="retomar" type="button">Retomar</button>
              <button class="btn" data-acao="pausar" type="button" title="Congela a líder e os agentes onde estão (dormindo). Retomar continua do mesmo ponto, sem relançar nada">⏸ Pausar</button>
              <button class="btn bloquear" data-acao="bloquear" type="button" title="Bloqueado por algo de fora (decisão, acesso, credencial, outra área): vai para a sala de bloqueados até você desbloquear">⛔ Bloquear</button>
              <button class="btn primario" data-acao="desbloquear" type="button" hidden title="A pendência foi resolvida: volta para uma baia e a líder retoma">✅ Desbloquear</button>
              <button class="btn perigo" data-acao="parar" type="button">Parar</button>
              <button class="btn" data-acao="reativar" type="button" title="Volta este contexto ao Office, na mesma sessão do Claude, para você mandar mais coisas">Reativar</button>
              <button class="btn" data-acao="dispensar" type="button">Dispensar</button>
            </div>
          </div>
          <div class="abas-det" role="tablist">
            <button type="button" data-aba="conversa">Conversa</button>
            <button type="button" data-aba="terminal">Terminal</button>
            <button type="button" data-aba="decisoes">Decisões</button>
          </div>
          <div id="mensagens" class="mensagens" data-painel="conversa"></div>
          <button id="ir-fim" class="ir-fim" type="button" hidden title="Ir para a última mensagem">↓</button>
          <div id="terminal" data-painel="terminal" hidden></div>
          <div id="decisoes" class="decisoes" data-painel="decisoes" hidden></div>
          <div id="pergunta" class="pergunta" hidden>
            <div class="p-topo"><span id="p-tipo" class="chip"></span> <span id="p-desde"></span></div>
            <div id="p-quem" class="p-quem"></div>
            <div id="p-texto" class="p-texto"></div>
            <div id="p-opcoes" class="p-opcoes"></div>
            <div class="p-alt">
              <input id="p-outra" type="text" maxlength="2000" placeholder="Outra alternativa ou observação…" autocomplete="off">
              <button id="p-enviar-outra" class="btn" type="button" title="Enviar como alternativa sua">Enviar</button>
            </div>
            <button id="p-detalhes" class="link" type="button">ver detalhes no terminal ↗</button>
          </div>
          <form id="composer" class="composer">
            <div class="caixa-texto">
              <div id="foco" class="foco" hidden aria-live="polite"></div>
              <textarea id="resposta" rows="2" placeholder="Mensagem para o agente…" maxlength="8000"></textarea>
            </div>
            <div class="composer-pe">
              <small id="composer-dica">Ctrl+Enter envia</small>
              <span class="composer-botoes">
                <button id="imagem" class="btn" type="button" title="Anexar imagem (ou cole com Ctrl+V, ou arraste para a caixa de texto)">🖼</button>
                <button id="registrar" class="btn" type="button" hidden title="A líder registra o que foi feito desde o último registro (no destino do time) e mostra o que gravou">📝 Registrar</button>
                <button id="corrigir" class="btn" type="button" hidden aria-pressed="false" title="Marca o foco em Corrigir: o próximo Enviar interrompe a líder e manda o seu texto no lugar (como o Esc no terminal; sem texto, só interrompe). Clique de novo, ou Esc, para voltar à líder.">✋ Corrigir</button>
                <button id="paralelo" class="btn" type="button" hidden aria-pressed="false" title="Marca o foco na cópia da líder: o que você enviar vai para ela, que responde agora sem interromper o trabalho da líder. As decisões ela encaminha à líder. Clique de novo, ou Esc, para voltar à líder.">💬 Paralelo</button>
                <button id="enviar" class="btn primario" type="submit" title="Com a líder trabalhando, a mensagem entra na fila (⏱) e ela recebe no próximo passo, sem parar o turno">Enviar</button>
              </span>
            </div>
          </form>
        </div>
      </section>
    </aside>
  </main>

  <div id="caixa-pop" class="caixa-pop" hidden></div>
  <div id="dica" class="dica" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-caixa" role="dialog" aria-modal="true">
      <div class="modal-topo"><h2 id="modal-titulo"></h2><button id="modal-fechar" class="btn icone" type="button">✕</button></div>
      <div id="modal-corpo" class="modal-corpo"></div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>

  <script type="module" src="/painel.js"></script>
</body>
</html>
